name: Offsite encrypted backup
on:
  schedule:
    - cron: '15 20 * * *' # 03:15 Asia/Ho_Chi_Minh
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backup-export
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - name: Configure SSH
        env:
          BACKUP_SSH_KEY: ${{ secrets.BACKUP_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BACKUP_SSH_KEY" > "$HOME/.ssh/backup"
          chmod 600 "$HOME/.ssh/backup"
          install -m 600 deploy/known_hosts "$HOME/.ssh/known_hosts"
      - name: Fetch encrypted backup and verify
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/encrypted-backup"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -i "$HOME/.ssh/backup" deploy@103.116.52.35 export > "$RUNNER_TEMP/backup-export.tar"
          tar -xf "$RUNNER_TEMP/backup-export.tar" -C "$RUNNER_TEMP/encrypted-backup"
          cd "$RUNNER_TEMP/encrypted-backup"
          sha256sum -c ./*.sha256
          test "$(find . -type f | wc -l)" -eq 2
      - name: Store encrypted archive for 30 days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nrapp-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/encrypted-backup/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Commit encrypted backup to repository
        run: |
          set -euo pipefail
          backup_dir=backups
          archive=$(find "$RUNNER_TEMP/encrypted-backup" -maxdepth 1 -type f -name 'nrapp-*.tar.age' -printf '%f\n')
          test "$(find "$RUNNER_TEMP/encrypted-backup" -maxdepth 1 -type f -name 'nrapp-*.tar.age' | wc -l)" -eq 1
          test -n "$archive"
          test -f "$RUNNER_TEMP/encrypted-backup/$archive.sha256"
          mkdir -p "$backup_dir"
          install -m 600 "$RUNNER_TEMP/encrypted-backup/$archive" "$backup_dir/$archive"
          install -m 600 "$RUNNER_TEMP/encrypted-backup/$archive.sha256" "$backup_dir/$archive.sha256"
          printf '%s\n' "$archive" > "$backup_dir/LATEST"
          chmod 600 "$backup_dir/LATEST"
          git config user.name 'lethanh2006'
          git config user.email 'thanhld2006.ptit@gmail.com'
          git add -f "$backup_dir/$archive" "$backup_dir/$archive.sha256" "$backup_dir/LATEST"
          if git diff --cached --quiet; then
            echo 'No new encrypted backup to commit'
            exit 0
          fi
          git commit -m "backup: $archive"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
      - name: Remove temporary key and transport
        if: always()
        run: rm -f "$HOME/.ssh/backup" "$RUNNER_TEMP/backup-export.tar"
